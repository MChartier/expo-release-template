# Validate the consumer contract using independently downloaded tooling without publication credentials.
name: Verify shared Expo release configuration
description: Check the consumer contract and matching package/workflow revision.
inputs:
  target:
    description: Consumer repository root relative to the workspace
    default: '.'
    required: false
runs:
  using: composite
  steps:
    - name: Validate the pinned consumer contract
      shell: bash
      env:
        RELEASE_TOOLKIT_PATH: ${{ github.action_path }}
        RELEASE_TOOLKIT_REVISION: ${{ github.action_ref }}
        RELEASE_CONSUMER_PATH: ${{ inputs.target }}
      run: node "$RELEASE_TOOLKIT_PATH/bin/check-consumer.mjs"
