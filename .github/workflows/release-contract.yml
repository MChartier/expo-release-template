# Runs the locked shared engine's contract tests against an exact consumer commit without publication credentials.
name: Shared release contract
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact consumer commit; defaults to the caller commit
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the exact locked snapshot
        run: node tools/verify-release-engine.mjs
      - name: Verify selection, recovery, and artifact contracts
        run: node --test tools/release-engine/test/*.test.mjs
