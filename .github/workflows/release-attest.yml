# This isolated signer handles inert artifact bytes and never checks out or executes application source.
name: Attest retained release inputs
on:
  workflow_call:
    inputs:
      release-id: { type: string, required: true }
      target: { type: string, required: true }
      targets: { type: string, required: true }
      action: { type: string, required: true }
      artifact-name: { type: string, required: true }
      artifact-attempt: { type: string, required: true }
      context-name: { type: string, required: true }
permissions: { contents: read }
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: &toolkit { repository: MChartier/expo-release-template, ref: '${{ job.workflow_sha }}', persist-credentials: false, path: .toolkit }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: &node { node-version: '24' }
      - run: &install npm ci --prefix .toolkit --ignore-scripts --no-audit --no-fund
      - run: node .toolkit/bin/expo-release.mjs setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: '${{ inputs.artifact-name }}', path: .release-artifacts }
      - id: verify
        # The context was produced by trusted source-free tooling with draft-ledger access.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: '${{ inputs.context-name }}', path: .release-state }
      - id: receipt
        run: node .toolkit/bin/artifact-worker.mjs verify-staged
        env: &authority
          GITHUB_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          TOOLKIT_COMMIT: ${{ job.workflow_sha }}
          RELEASE_ID: ${{ inputs.release-id }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_TARGETS: ${{ inputs.targets }}
          RELEASE_ACTION: ${{ inputs.action }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact-attempt }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: { subject-path: '${{ steps.receipt.outputs.receipt_files }}' }
  retain:
    needs: attest
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read, attestations: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: *node
      - run: *install
      - run: node .toolkit/bin/expo-release.mjs setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: '${{ inputs.artifact-name }}', path: .release-artifacts }
      - run: node .toolkit/bin/artifact-worker.mjs retain
        env: *authority
