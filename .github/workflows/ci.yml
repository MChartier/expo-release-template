# Validates the shared package, release behavior and installed distribution on Windows and Linux.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/generate-types.mjs --check
      - run: npx --no-install tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 src/index.d.mts
      - run: npm test
        env:
          EXPO_RELEASE_INSTALL_TEST: '1'
          EXPO_RELEASE_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  engine-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }
      - run: node --test packages/release-engine/test/*.test.mjs
