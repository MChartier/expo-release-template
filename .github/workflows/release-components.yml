# Fixed phase topology is derived from the canonical plan; target readiness is rechecked against the durable journal in every worker.
name: Execute release components
on:
  workflow_call:
    inputs:
      release-id: { type: string, required: true }
      matrices: { type: string, required: true }
      retry-stage: { type: string, default: '' }
    secrets:
      EXPO_TOKEN: { required: false }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_STORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      DEPLOY_WG_ENDPOINT: { required: false }
      DEPLOY_WG_PRIVATE_KEY: { required: false }
      DEPLOY_TOKEN: { required: false }
permissions: { contents: read }
jobs:
  server-build:
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).server != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).server) }}' } }
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/release-artifact.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: build
  server-publish:
    needs: [server-build]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).server_publish != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).server_publish) }}' } }
    permissions: { contents: write, actions: read, packages: write, attestations: read }
    uses: ./.github/workflows/release-image.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: publish
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
  server-finalize:
    needs: server-publish
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).server_finalize != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).server_finalize) }}' } }
    permissions: { contents: write, actions: read, packages: write, attestations: read }
    uses: ./.github/workflows/release-image.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: finalize
      approval: ${{ matrix.target.approval }}
  native-build:
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).native_builds != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).native_builds) }}' } }
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/release-artifact.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: build
      signing-environment: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  deployment:
    needs: [server-publish, server-finalize]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).deployment != '' }}
    permissions: { contents: write, actions: read }
    uses: ./.github/workflows/release-deploy.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ fromJSON(inputs.matrices).deployment }}
      approval: ${{ fromJSON(inputs.matrices).deployment_approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  native-first-handoff:
    needs: [native-build, deployment]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).native_first != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).native_first) }}' } }
    permissions: { contents: write, actions: read, attestations: read }
    uses: ./.github/workflows/release-publish.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: handoff
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  native-first-submit:
    needs: [native-first-handoff]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).native_first != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).native_first) }}' } }
    permissions: { contents: write, actions: read, attestations: read }
    uses: ./.github/workflows/release-publish.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: submit
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  native-second-handoff:
    needs: [native-build, deployment, native-first-submit]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).native_second != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).native_second) }}' } }
    permissions: { contents: write, actions: read, attestations: read }
    uses: ./.github/workflows/release-publish.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: handoff
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  native-second-submit:
    needs: [native-second-handoff]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).native_second != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).native_second) }}' } }
    permissions: { contents: write, actions: read, attestations: read }
    uses: ./.github/workflows/release-publish.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: submit
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ota-first-export:
    needs: [deployment, native-build, native-first-handoff]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).ota_first != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).ota_first) }}' } }
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/release-artifact.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: export
      approval: ${{ matrix.target.approval }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ota-first-publish:
    needs: [ota-first-export]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).ota_first != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).ota_first) }}' } }
    permissions: { contents: write, actions: read, attestations: read }
    uses: ./.github/workflows/release-publish.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: publish
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ota-second-export:
    needs: [deployment, native-build, ota-first-publish, native-second-handoff]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).ota_second != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).ota_second) }}' } }
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/release-artifact.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: export
      approval: ${{ matrix.target.approval }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ota-second-publish:
    needs: [ota-second-export]
    if: ${{ always() && !cancelled() && fromJSON(inputs.matrices).ota_second != '[]' }}
    strategy: { fail-fast: false, matrix: { target: '${{ fromJSON(fromJSON(inputs.matrices).ota_second) }}' } }
    permissions: { contents: write, actions: read, attestations: read }
    uses: ./.github/workflows/release-publish.yml
    with:
      release-id: ${{ inputs.release-id }}
      target: ${{ matrix.target.target }}
      action: publish
      approval: ${{ matrix.target.approval }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
