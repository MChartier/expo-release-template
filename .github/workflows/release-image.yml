# Source-free GHCR publication has package write permission only in its own worker.
name: Publish verified image
on:
  workflow_call:
    inputs:
      release-id:
        type: string
        required: true
      target:
        type: string
        required: true
      action:
        type: string
        required: true
      retry-stage:
        type: string
        default: ""
      approval:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  publish:
    if: inputs.approval == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: &a1
      contents: write
      actions: read
      packages: write
      attestations: read
    steps: &a2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MChartier/expo-release-template
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: .toolkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci --prefix .toolkit --ignore-scripts --no-audit --no-fund
      - run: node .toolkit/bin/expo-release.mjs setup
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - run: node .toolkit/bin/artifact-worker.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          TOOLKIT_COMMIT: ${{ job.workflow_sha }}
          RELEASE_ID: ${{ inputs.release-id }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_RETRY_STAGE: ${{ inputs.retry-stage }}
  approved:
    if: inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    timeout-minutes: 60
    permissions: *a1
    steps: *a2
