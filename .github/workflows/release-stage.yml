# One source-free worker for publication, retained artifacts and reconciliation. Jobs grant only their provider capability.
name: Execute release stage
on:
  workflow_call:
    inputs:
      release-id: { type: string, required: true }
      stage: { type: string, required: true }
      provider: { type: string, required: true }
      approval: { type: string, required: true }
      access-token-secret: { type: string, default: '' }
      service-account-secret: { type: string, default: '' }
      retry-stage: { type: string, default: '' }
      state-attempt: { type: string, default: '' }
      mode: { type: string, default: 'run' }
    secrets:
      EXPO_TOKEN: { required: false }
      GOOGLE_PLAY_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      DEPLOY_WG_ENDPOINT: { required: false }
      DEPLOY_WG_PRIVATE_KEY: { required: false }
      DEPLOY_TOKEN: { required: false }
permissions: { contents: read }
jobs:
  expo:
    if: inputs.provider == 'expo' && inputs.approval == ''
    runs-on: ubuntu-latest
    permissions: &provider_permissions { contents: write, actions: read, attestations: read }
    steps: &stage_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: MChartier/expo-release-template, ref: '${{ job.workflow_sha }}', persist-credentials: false, path: .toolkit }
      - uses: ./.toolkit/.github/actions/setup
        with: { eas: '${{ inputs.provider == ''expo'' }}' }
      - if: inputs.provider == 'image'
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y skopeo
      - if: inputs.provider == 'deploy' && inputs.mode == 'run'
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y wireguard-tools
      - if: inputs.mode == 'reconcile'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'release-authority-${{ inputs.state-attempt }}', path: .release-state }
      - run: node .toolkit/bin/worker.mjs stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          TOOLKIT_COMMIT: ${{ job.workflow_sha }}
          RELEASE_ID: ${{ inputs.release-id }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_PROVIDER: ${{ inputs.provider }}
          RELEASE_APPROVAL: ${{ inputs.approval }}
          RELEASE_RETRY_STAGE: ${{ inputs.retry-stage }}
          EXPO_TOKEN: ${{ inputs.provider == 'expo' && secrets.EXPO_TOKEN || '' }}
          GHCR_TOKEN: ${{ inputs.provider == 'image' && github.token || '' }}
          RELEASE_ACCESS_TOKEN: ${{ inputs.provider == 'play' && secrets[inputs.access-token-secret] || '' }}
          RELEASE_SERVICE_ACCOUNT: ${{ inputs.provider == 'play' && secrets[inputs.service-account-secret] || '' }}
          DEPLOY_HOST: ${{ inputs.provider == 'deploy' && vars.DEPLOY_HOST || '' }}
          DEPLOY_URL: ${{ inputs.provider == 'deploy' && vars.DEPLOY_URL || '' }}
          DEPLOY_WG_ADDRESS: ${{ inputs.provider == 'deploy' && vars.DEPLOY_WG_ADDRESS || '' }}
          DEPLOY_WG_PUBLIC_KEY: ${{ inputs.provider == 'deploy' && vars.DEPLOY_WG_PUBLIC_KEY || '' }}
          DEPLOY_WG_ENDPOINT: ${{ inputs.provider == 'deploy' && inputs.mode == 'run' && secrets.DEPLOY_WG_ENDPOINT || '' }}
          DEPLOY_WG_PRIVATE_KEY: ${{ inputs.provider == 'deploy' && inputs.mode == 'run' && secrets.DEPLOY_WG_PRIVATE_KEY || '' }}
          DEPLOY_TOKEN: ${{ inputs.provider == 'deploy' && inputs.mode == 'run' && secrets.DEPLOY_TOKEN || '' }}
  approved-expo:
    if: inputs.provider == 'expo' && inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    permissions: *provider_permissions
    steps: *stage_steps
  play:
    if: inputs.provider == 'play' && inputs.approval == ''
    runs-on: ubuntu-latest
    permissions: *provider_permissions
    steps: *stage_steps
  approved-play:
    if: inputs.provider == 'play' && inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    permissions: *provider_permissions
    steps: *stage_steps
  image:
    if: inputs.provider == 'image' && inputs.mode == 'run' && inputs.approval == ''
    runs-on: ubuntu-latest
    permissions: &image_permissions { contents: write, actions: read, attestations: read, packages: write }
    steps: *stage_steps
  approved-image:
    if: inputs.provider == 'image' && inputs.mode == 'run' && inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    permissions: *image_permissions
    steps: *stage_steps
  observe-image:
    if: inputs.provider == 'image' && inputs.mode == 'reconcile' && inputs.approval == ''
    runs-on: ubuntu-latest
    permissions: &image_observer_permissions { contents: write, actions: read, attestations: read, packages: read }
    steps: *stage_steps
  approved-observe-image:
    if: inputs.provider == 'image' && inputs.mode == 'reconcile' && inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    permissions: *image_observer_permissions
    steps: *stage_steps
  deploy:
    if: inputs.provider == 'deploy' && inputs.approval == ''
    runs-on: ubuntu-latest
    permissions: *provider_permissions
    steps: *stage_steps
  approved-deploy:
    if: inputs.provider == 'deploy' && inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    permissions: *provider_permissions
    steps: *stage_steps
