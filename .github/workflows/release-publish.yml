# Source-free Expo publication never receives image publication permissions.
name: Publish verified release stage
on:
  workflow_call:
    inputs:
      release-id:
        type: string
        required: true
      target:
        type: string
        required: true
      action:
        type: string
        required: true
      retry-stage:
        type: string
        default: ""
      approval:
        type: string
        default: ""
    secrets:
      EXPO_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  publish:
    if: inputs.approval == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - &a1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MChartier/expo-release-template
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: .toolkit
      - &a2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - &a3
        run: npm ci --prefix .toolkit --ignore-scripts --no-audit --no-fund
      - &a4
        run: node .toolkit/bin/artifact-worker.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          TOOLKIT_COMMIT: ${{ job.workflow_sha }}
          RELEASE_ID: ${{ inputs.release-id }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_RETRY_STAGE: ${{ inputs.retry-stage }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  approved-publish:
    if: inputs.approval != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval }}
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
