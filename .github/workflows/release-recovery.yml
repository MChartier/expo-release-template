# Shared release jobs preserve source, signing, approval and publication boundaries.
name: Recover retained release
on:
  workflow_call:
    inputs:
      state-attempt: { type: string, required: true }
    secrets:
      EXPO_TOKEN: { required: false }
      GOOGLE_PLAY_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_STORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      DEPLOY_WG_ENDPOINT: { required: false }
      DEPLOY_WG_PRIVATE_KEY: { required: false }
      DEPLOY_TOKEN: { required: false }
permissions: { contents: read }
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, actions: read, attestations: read }
    outputs:
      release_id: ${{ steps.recover.outputs.release_id }}
      execute: ${{ steps.recover.outputs.execute }}
      reconcile: ${{ steps.recover.outputs.reconcile }}
      matrices: ${{ steps.recover.outputs.matrices }}
      retry_stage: ${{ steps.recover.outputs.retry_stage }}
      approval: ${{ steps.recover.outputs.approval }}
      provider: ${{ steps.recover.outputs.provider }}
      stage: ${{ steps.recover.outputs.stage }}
      access_token_secret: ${{ steps.recover.outputs.access_token_secret }}
      service_account_secret: ${{ steps.recover.outputs.service_account_secret }}
      rerun_run_id: ${{ steps.recover.outputs.rerun_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: &toolkit { repository: MChartier/expo-release-template, ref: '${{ job.workflow_sha }}', persist-credentials: false, path: .toolkit }
      - uses: ./.toolkit/.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'release-authority-${{ inputs.state-attempt }}', path: .release-state }
      - id: recover
        run: node .toolkit/bin/worker.mjs recover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          TOOLKIT_COMMIT: ${{ job.workflow_sha }}
  reconcile:
    needs: recover
    if: needs.recover.outputs.reconcile == 'true'
    permissions: { contents: write, actions: read, packages: write, attestations: read }
    uses: ./.github/workflows/release-stage.yml
    with:
      state-attempt: ${{ inputs.state-attempt }}
      release-id: ${{ needs.recover.outputs.release_id }}
      stage: ${{ needs.recover.outputs.stage }}
      provider: ${{ needs.recover.outputs.provider }}
      approval: ${{ needs.recover.outputs.approval }}
      access-token-secret: ${{ needs.recover.outputs.access_token_secret }}
      service-account-secret: ${{ needs.recover.outputs.service_account_secret }}
      mode: reconcile
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_ACCESS_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_TEST_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN }}
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64 }}
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  candidate:
    needs: recover
    if: needs.recover.outputs.rerun_run_id != ''
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps:
      - name: Resume failed candidate jobs in their original trusted run
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/rerun-failed-jobs"
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ needs.recover.outputs.rerun_run_id }}
  components:
    needs: recover
    if: needs.recover.outputs.execute == 'true'
    permissions: { contents: write, actions: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/release-components.yml
    with:
      release-id: ${{ needs.recover.outputs.release_id }}
      matrices: ${{ needs.recover.outputs.matrices }}
      retry-stage: ${{ needs.recover.outputs.retry_stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_ACCESS_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_TEST_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN }}
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  finish:
    needs: [recover, components]
    if: always() && needs.recover.outputs.execute == 'true' && needs.components.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
      - run: node .toolkit/bin/worker.mjs finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          RELEASE_ID: ${{ needs.recover.outputs.release_id }}
