# Fixed two-wave orchestration for retained submissions and independent promotion/deployment operations.
name: Run retained operation
on:
  workflow_call:
    inputs:
      state-attempt: { type: string, required: true }
      release-id: { type: string, default: '' }
      retry-stage: { type: string, default: '' }
    secrets:
      EXPO_TOKEN: { required: false }
      GOOGLE_PLAY_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: { required: false }
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: { required: false }
      DEPLOY_WG_ENDPOINT: { required: false }
      DEPLOY_WG_PRIVATE_KEY: { required: false }
      DEPLOY_TOKEN: { required: false }
permissions: { contents: read }
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      first: ${{ steps.prepare.outputs.first }}
      second: ${{ steps.prepare.outputs.second }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: &toolkit { repository: MChartier/expo-release-template, ref: '${{ job.workflow_sha }}', persist-credentials: false, path: .toolkit }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: &node { node-version: '24' }
      - run: &install npm ci --prefix .toolkit --ignore-scripts --no-audit --no-fund
      - run: node .toolkit/bin/expo-release.mjs setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'release-authority-${{ inputs.state-attempt }}', path: .release-state }
      - id: prepare
        run: node .toolkit/bin/worker.mjs operation-plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          TOOLKIT_COMMIT: ${{ job.workflow_sha }}
          RELEASE_ID: ${{ inputs.release-id }}
  first:
    needs: prepare
    if: needs.prepare.outputs.first != '[]'
    strategy:
      fail-fast: false
      matrix: { include: '${{ fromJSON(needs.prepare.outputs.first) }}' }
    permissions: { contents: write, actions: read, attestations: read, packages: write }
    uses: ./.github/workflows/release-operation-stage.yml
    with:
      release-id: ${{ needs.prepare.outputs.release_id }}
      stage: ${{ matrix.stage }}
      provider: ${{ matrix.provider }}
      approval: ${{ matrix.approval }}
      access-token-secret: ${{ matrix.access_token_secret }}
      service-account-secret: ${{ matrix.service_account_secret }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_ACCESS_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_TEST_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN }}
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64 }}
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  second:
    needs: [prepare, first]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.second != '[]'
    strategy:
      fail-fast: false
      matrix: { include: '${{ fromJSON(needs.prepare.outputs.second) }}' }
    permissions: { contents: write, actions: read, attestations: read, packages: write }
    uses: ./.github/workflows/release-operation-stage.yml
    with:
      release-id: ${{ needs.prepare.outputs.release_id }}
      stage: ${{ matrix.stage }}
      provider: ${{ matrix.provider }}
      approval: ${{ matrix.approval }}
      access-token-secret: ${{ matrix.access_token_secret }}
      service-account-secret: ${{ matrix.service_account_secret }}
      retry-stage: ${{ inputs.retry-stage }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_ACCESS_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_INTERNAL_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_TEST_ACCESS_TOKEN }}
      GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_INTERNAL_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN }}
      GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64 }}
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  finish:
    needs: [prepare, first, second]
    if: always() && needs.prepare.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: *node
      - run: *install
      - run: node .toolkit/bin/expo-release.mjs setup
      - run: node .toolkit/bin/worker.mjs finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONSUMER_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
