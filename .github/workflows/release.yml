# Three fixed release paths. Source, signing, publishing and deployment credentials stay in separate jobs.
name: Release Expo application
on:
  workflow_call:
    inputs:
      profile: { type: string, required: true }
      rebuild: { type: boolean, default: false }
    secrets:
      EXPO_TOKEN: { required: false }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_STORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      DEPLOY_WG_ENDPOINT: { required: false }
      DEPLOY_WG_PRIVATE_KEY: { required: false }
      DEPLOY_TOKEN: { required: false }
permissions: { contents: read }
concurrency: { group: expo-release, cancel-in-progress: false }
env:
  RELEASE_PROFILE: ${{ inputs.profile }}
jobs:
  context:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: read }
    outputs:
      mobile: ${{ steps.context.outputs.mobile }}
      approval: ${{ steps.context.outputs.approval }}
      signing: ${{ steps.context.outputs.signing }}
      submit_environment: ${{ steps.context.outputs.submit_environment }}
      deploy_environment: ${{ steps.context.outputs.deploy_environment }}
      builder: ${{ steps.context.outputs.builder }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: &toolkit { repository: MChartier/expo-release-template, ref: '${{ job.workflow_sha }}', path: .toolkit, persist-credentials: false }
      - uses: ./.toolkit/.github/actions/setup
      - id: context
        run: node .toolkit/bin/worker.mjs context
        env: { GITHUB_TOKEN: '${{ github.token }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-context, path: state, if-no-files-found: error }
  environment:
    needs: context
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.approval }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: context, eas: '${{ needs.context.outputs.mobile }}' }
      - run: node .toolkit/bin/worker.mjs environment
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-environment, path: state, if-no-files-found: error }
  prepare:
    needs: environment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      noop: ${{ steps.prepare.outputs.noop }}
      server: ${{ steps.prepare.outputs.server }}
      native: ${{ steps.prepare.outputs.native }}
      submit: ${{ steps.prepare.outputs.submit }}
      ota: ${{ steps.prepare.outputs.ota }}
      native_matrix: ${{ steps.prepare.outputs.native_matrix }}
      build: ${{ steps.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: environment }
      - run: node .toolkit/bin/worker.mjs install
      - id: prepare
        run: node .toolkit/bin/worker.mjs prepare
        env: { RELEASE_REBUILD: '${{ inputs.rebuild }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-plan, path: state, if-no-files-found: error }
  reserve:
    needs: prepare
    if: needs.prepare.outputs.noop != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan }
      - run: node .toolkit/bin/worker.mjs reserve
        env: { GITHUB_TOKEN: '${{ github.token }}' }
  server-build:
    needs: [prepare, reserve]
    if: needs.prepare.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { source: '${{ needs.prepare.outputs.build }}', state: plan }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y skopeo
      - run: node .toolkit/bin/worker.mjs install
      - run: node .toolkit/bin/worker.mjs server-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: server-image, path: artifacts, if-no-files-found: error, compression-level: 0 }
  server-publish:
    needs: [context, server-build]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.approval }}
    permissions: { contents: write, deployments: write, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: server-image, path: artifacts }
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y skopeo
      - run: node .toolkit/bin/worker.mjs server-publish
        env: { GITHUB_TOKEN: '${{ github.token }}', GHCR_TOKEN: '${{ github.token }}' }
  server-deploy:
    needs: [context, server-publish]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.deploy_environment }}
    permissions: { contents: write, deployments: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan }
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y wireguard-tools
      - run: node .toolkit/bin/worker.mjs server-deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_WG_ADDRESS: ${{ vars.DEPLOY_WG_ADDRESS }}
          DEPLOY_WG_PUBLIC_KEY: ${{ vars.DEPLOY_WG_PUBLIC_KEY }}
          DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
          DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  native-start:
    needs: [prepare, reserve, server-deploy]
    if: >-
      always() && !cancelled() && needs.reserve.result == 'success' && needs.prepare.outputs.native == 'true' &&
      (needs.prepare.outputs.server != 'true' || needs.server-deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan }
      - run: node .toolkit/bin/worker.mjs native-start
        env: { GITHUB_TOKEN: '${{ github.token }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: native-intents, path: state/native-intents.json, if-no-files-found: error }
  native-build:
    needs: [context, prepare, native-start]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.context.outputs.signing }}
    strategy:
      fail-fast: false
      matrix: { target: '${{ fromJSON(needs.prepare.outputs.native_matrix) }}' }
    env: { RELEASE_TARGET: '${{ matrix.target.id }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { source: '${{ needs.prepare.outputs.build }}', state: plan, eas: '${{ needs.context.outputs.builder == ''eas'' }}' }
      - run: node .toolkit/bin/worker.mjs install
      - if: needs.context.outputs.builder == 'command'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - if: needs.context.outputs.builder == 'command'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - if: needs.context.outputs.builder == 'command'
        run: node .toolkit/bin/android-tools.mjs
      - if: needs.context.outputs.builder == 'command'
        run: node .toolkit/bin/worker.mjs native-prebuild
      - if: needs.context.outputs.builder == 'command'
        run: node .toolkit/bin/worker.mjs native-command
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: needs.context.outputs.builder == 'eas'
        run: node .toolkit/bin/worker.mjs native-cloud
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'native-build-${{ matrix.target.id }}', path: artifacts, if-no-files-found: error, compression-level: 0 }
  native-record:
    needs: [context, native-start, native-build]
    if: always() && !cancelled() && needs.native-start.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write, deployments: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan, eas: '${{ needs.context.outputs.builder == ''eas'' }}' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: native-intents, path: state }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: 'native-build-*', merge-multiple: true, path: artifacts }
      - run: node .toolkit/bin/worker.mjs native-record
        env: { GITHUB_TOKEN: '${{ github.token }}', EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
  native-submit:
    needs: [context, prepare, native-record, server-deploy]
    if: >-
      always() && !cancelled() && needs.prepare.outputs.submit == 'true' && needs.native-record.result == 'success' &&
      (needs.prepare.outputs.server != 'true' || needs.server-deploy.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.submit_environment }}
    permissions: { contents: write, deployments: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan, eas: 'true' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: native-intents, path: state }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: 'native-build-*', merge-multiple: true, path: artifacts }
      - run: node .toolkit/bin/worker.mjs native-submit
        env: { GITHUB_TOKEN: '${{ github.token }}', EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
  ota-export:
    needs: [prepare, reserve]
    if: needs.prepare.outputs.ota != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { platform: '${{ fromJSON(needs.prepare.outputs.ota) }}' }
    env: { RELEASE_TARGET: '${{ matrix.platform }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { source: '${{ needs.prepare.outputs.build }}', state: plan }
      - run: node .toolkit/bin/worker.mjs install
      - run: node .toolkit/bin/worker.mjs ota-export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'ota-${{ matrix.platform }}', path: artifacts, if-no-files-found: error }
  ota-publish:
    needs: [context, prepare, ota-export, native-record, server-deploy]
    if: >-
      always() && !cancelled() && needs.ota-export.result == 'success' &&
      (needs.prepare.outputs.native != 'true' || needs.native-record.result == 'success') &&
      (needs.prepare.outputs.server != 'true' || needs.server-deploy.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.approval }}
    permissions: { contents: write, deployments: write }
    strategy:
      fail-fast: false
      matrix: { platform: '${{ fromJSON(needs.prepare.outputs.ota) }}' }
    env: { RELEASE_TARGET: '${{ matrix.platform }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *toolkit
      - uses: ./.toolkit/.github/actions/setup
        with: { state: plan, eas: 'true' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'ota-${{ matrix.platform }}', path: artifacts }
      - run: node .toolkit/bin/worker.mjs ota-publish
        env: { GITHUB_TOKEN: '${{ github.token }}', EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
