# Install trusted toolkit dependencies and upstream EAS before admitting provider credentials.
name: Release setup
description: Prepare a fixed release job with immutable source and current-run artifacts
inputs:
  source: { description: Consumer commit, default: '' }
  state: { description: Current-run context artifact, default: '' }
  eas: { description: Install the pinned official EAS CLI, default: 'false' }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with: { node-version: '24' }
    - shell: bash
      run: |
        npm ci --prefix .toolkit --ignore-scripts --no-audit --no-fund
        echo "TOOLKIT_SHA=$(git -C .toolkit rev-parse HEAD)" >> "$GITHUB_ENV"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: { repository: '${{ github.repository }}', ref: '${{ inputs.source || github.sha }}', path: app, persist-credentials: false, fetch-depth: 0 }
    - if: inputs.state != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: { name: 'release-${{ inputs.state }}', path: state }
    - if: inputs.eas == 'true'
      uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06
      with: { eas-version: '25.3.0', packager: npm }
